<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>✶✶ Reader</title>

  <!-- Web app manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="✶✶ Reader" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- Theme color (light + dark) -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20'/><path d='m8 13 4-7 4 7'/><path d='M9.1 11h5.7'/></svg>" />

  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>✶✶ Reader</h1>
      <div class="controls" id="controls" hidden>
        <select id="scope">
          <option value="network">My Network</option>
          <option value="me">My Are.na</option>
          <option value="all">All Are.na</option>
        </select>
        <select id="sort">
          <option value="created_at_desc">Created</option>
          <option value="updated_at_desc">Updated</option>
          <option value="popular">Popular</option>
          <option value="random">Random</option>
        </select>
        <select id="hotlinks-window" class="popular-ctrl" hidden>
          <option value="7">7d</option>
          <option value="14">14d</option>
          <option value="30">30d</option>
          <option value="60">60d</option>
          <option value="90">90d</option>
          <option value="365">1y</option>
          <option value="0">All</option>
        </select>
        <select id="type">
          <option value="Link">Links</option>
          <option value="Image">Images</option>
          <option value="Embed">Embeds</option>
          <option value="Attachment">Attachments</option>
          <option value="Text">Text</option>
          <option value="Block">All</option>
        </select>
        <button id="refresh" type="button" class="icon-btn" title="Refresh" aria-label="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <div class="view-toggle" id="view-toggle">
          <button type="button" data-view="list" title="List" aria-label="List view">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="2" fill="currentColor"/><rect x="1" y="7" width="14" height="2" fill="currentColor"/><rect x="1" y="12" width="14" height="2" fill="currentColor"/></svg>
          </button>
          <button type="button" data-view="grid" title="Grid" aria-label="Grid view">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" fill="currentColor"/><rect x="9" y="1" width="6" height="6" fill="currentColor"/><rect x="1" y="9" width="6" height="6" fill="currentColor"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="filter-wrap">
          <button id="filter-btn" type="button" class="icon-btn" title="Filters" aria-label="Filters" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20"/><path d="M6 12h12"/><path d="M9 19h6"/></svg>
            <span id="filter-count" class="icon-badge">0</span>
          </button>
          <div id="filter-dropdown" class="filter-dropdown" hidden>
            <div class="filter-dropdown-head">
              <span>Filtered</span>
              <button id="filter-toggle" type="button" class="filter-toggle-btn">On</button>
            </div>
            <div id="filter-list" class="filter-list"></div>
          </div>
        </div>
        <button id="settings-toggle" type="button" class="icon-btn" title="Token settings" aria-label="Token settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="auth-overlay" class="auth-overlay" hidden></div>
  <section id="auth" class="auth" hidden>
    <button id="auth-close" type="button" class="auth-close" aria-label="Close">&times;</button>
    <p id="auth-msg">
      Connect your Are.na account with a <a href="https://www.are.na/settings/personal-access-tokens" target="_blank" rel="noopener">personal access token</a>.
      <span class="auth-note">Stored in your browser only, sent only to <code>api.are.na</code>.</span>
    </p>
    <form id="token-form" class="token-form">
      <input
        id="token-input"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="Paste token here"
        aria-label="Personal access token"
      />
      <button type="submit">Connect</button>
    </form>
    <button id="sign-out" type="button" class="sign-out" hidden>Sign out</button>
  </section>

  <main class="container">

    <section id="status" class="status" hidden></section>

    <section id="feed" class="feed" aria-live="polite"></section>

    <div class="loadmore-wrap">
      <button id="loadmore" type="button" hidden>Load more</button>
    </div>
  </main>

  <script src="app.js?v=15"></script>
</body>
</html>
