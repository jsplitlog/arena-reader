<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- img-src stays broad (https:) for Are.na CDN thumbnails/avatars and
       per-domain favicons; connect-src covers the API and OAuth token
       endpoint. The authorize step is a top-level navigation (unaffected). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.are.na; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <title>✶✶ Reader</title>

  <!-- Web app manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="✶✶ Reader" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />

  <!-- Theme color (light + dark) -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M7 7v10'/><path d='M11 7v10'/><path d='m15 7 2 10'/></svg>" />

  <link rel="stylesheet" href="styles.css?v=55" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="app-title" role="button" tabindex="0" title="Home — My Network · Created · Links">✶✶ Reader</h1>
      <div class="controls" id="controls" hidden>
        <span class="spacer"></span>
        <div class="select-row">
          <select id="scope">
            <option value="network">My Network</option>
            <option value="me">My Are.na</option>
            <option value="all">All Are.na</option>
          </select>
          <select id="sort">
            <option value="created_at_desc">Created</option>
            <option value="updated_at_desc">Updated</option>
            <option value="random">Random</option>
          </select>
          <select id="type">
            <option value="Link">Links</option>
            <option value="Image">Images</option>
            <option value="Embed">Embeds</option>
            <option value="Attachment">Attachments</option>
            <option value="Text">Text</option>
            <option value="Block">All</option>
          </select>
        </div>
        <span class="spacer"></span>
        <button id="settings-toggle" type="button" class="icon-btn" title="Token settings" aria-label="Token settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="refresh" type="button" class="icon-btn" title="Refresh" aria-label="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <div class="filter-wrap">
          <button id="filter-btn" type="button" class="icon-btn" title="Filters" aria-label="Filters" popovertarget="filter-dropdown">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg>
            <span id="filter-count" class="icon-badge">0</span>
          </button>
          <div id="filter-dropdown" class="filter-dropdown" popover>
            <div class="filter-dropdown-head">
              <span>Filters</span>
              <button id="filter-toggle" type="button" class="filter-toggle-btn">On</button>
            </div>
            <div id="filter-list" class="filter-list"></div>
          </div>
        </div>
        <button id="view-toggle" type="button" class="icon-btn" title="Grid view" aria-label="Switch to grid view">
          <svg class="view-icon-list" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/></svg>
          <svg class="view-icon-grid" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M3 12h18"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="auth-overlay" class="auth-overlay"></div>
  <section id="auth" class="auth">
    <div class="auth-brand">
      <strong>✶✶ Reader</strong>
      <div id="auth-user" class="auth-user" hidden>
        <img id="auth-avatar" class="avatar" alt="" hidden />
        <span id="auth-avatar-fallback" class="avatar avatar-fallback" hidden></span>
        <span id="auth-username" class="auth-username"></span>
      </div>
      <span id="auth-tagline">An RSS style reader for Are.na</span>
    </div>
    <div id="oauth-connect" class="oauth-connect" hidden>
      <button id="oauth-signin" type="button" class="auth-btn oauth-primary">Sign in with Are.na ✶✶</button>
    </div>
    <div id="auth-actions" class="auth-actions" hidden>
      <button id="sign-out" type="button" class="auth-btn">Sign out</button>
    </div>
    <p id="auth-msg" hidden></p>
    <div class="auth-footer">
      <label class="remember-label" for="remember-token" id="remember-label">
        <input id="remember-token" type="checkbox" />
        Remember device
      </label>
      <a id="manage-apps" href="https://www.are.na/developers/oauth/authorized" target="_blank" rel="noopener" class="auth-source" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        Manage apps
      </a>
      <a href="https://github.com/jsplitlog/arena-reader" target="_blank" rel="noopener" class="auth-source">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        View source
      </a>
    </div>
  </section>

  <main class="container">

    <section id="status" class="status" hidden></section>

    <div id="skeleton" class="skeleton" aria-hidden="true" hidden></div>

    <section id="feed" class="feed" aria-live="polite"></section>

    <div class="loadmore-wrap">
      <div id="feed-sentinel" class="feed-sentinel" aria-hidden="true"></div>
      <button id="loadmore" type="button" hidden>Load more</button>
      <div id="loadmore-spinner" class="loadmore-spinner" role="status" aria-label="Loading more" hidden></div>
    </div>
  </main>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="oauth.js?v=45"></script>
  <script src="app.js?v=55"></script>
</body>
</html>
