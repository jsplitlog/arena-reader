# Deploys the site to GitHub Pages, adding Areal from jsplitlog/areal-fonts.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: site

      - uses: actions/checkout@v7
        with:
          repository: jsplitlog/areal-fonts
          ssh-key: ${{ secrets.AREAL_FONTS_DEPLOY_KEY }}
          path: fonts

      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude='.*' site/ _site/
          mkdir -p _site/assets/fonts
          cp "fonts/ABC Areal/WOFF2/ABCArealVariable.woff2" _site/assets/fonts/

      # Semi Mono only sets source domains (lowercase ASCII), so ship just
      # those glyphs: ~12 KB instead of ~164 KB.
      - name: Subset Areal Semi Mono
        run: |
          python3 -m venv /tmp/ft
          /tmp/ft/bin/pip install --quiet fonttools brotli
          /tmp/ft/bin/pyftsubset "fonts/ABC Areal Semi Mono/WOFF2/ABCArealSemiMonoVariable.woff2" \
            --unicodes="U+002D-002E,U+0030-0039,U+0061-007A,U+2026" \
            --layout-features='' --flavor=woff2 \
            --output-file=_site/assets/fonts/ABCArealSemiMonoVariable.woff2

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
